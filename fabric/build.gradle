plugins {
    id 'java-library'
    // 1. MUST use the new plugin ID for unobfuscated versions (Minecraft 26.1+)
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
}

base {
    archivesName = "${mod_id}-fabric"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // 2. REMOVED: mappings loom.officialMojangMappings()
    // Do not include any mappings line here. The game is unobfuscated!

    // 3. From 26.1 onwards, use standard "implementation", NOT "modImplementation"
    // implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    // implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    implementation project(":common")
}