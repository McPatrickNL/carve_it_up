pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        // CRITICAL: This allows Gradle to find the 'net.fabricmc.fabric-loom' plugin!
        maven { url = "https://maven.fabricmc.net/" }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = "carve_it_up"

include("common")
include("neoforge")
include("fabric")